name: ocean_escape
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.2.0+5

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: 2.0.0
  flame: 1.38.2
  flame_audio: ^2.11.9
  shared_preferences: 2.5.6
  rename: ^3.1.0
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  url_launcher: ^6.3.2
  google_mobile_ads: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/ocean_escape.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo/ocean_escape.png"

flutter:

  uses-material-design: true

  assets:
    - assets/audio/sfx/
    - assets/logo/ocean_escape.png
